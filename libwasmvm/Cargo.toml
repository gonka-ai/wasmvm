[package]
name = "wasmvm"
version = "3.0.9"
publish = false
authors = ["Ethan Frey <ethanfrey@users.noreply.github.com>"]
edition = "2021"
description = "Go bindings for cosmwasm contracts"
repository = "https://github.com/CosmWasm/wasmvm"
license = "Apache-2.0"
readme = "README.md"
exclude = [".gitignore"]

[lib]
crate-type = ["cdylib", "rlib"]

# the example is to allow us to compile a muslc static lib with the same codebase as we compile the
# normal dynamic libs (best workaround I could find to override crate-type on the command line)
[[example]]
name = "wasmvmstatic"
path = "src/examples/wasmvmstatic.rs"
crate-type = ["staticlib"]

[features]
default = []
# This feature requires Rust nightly because it depends on the unstable backtrace feature.
backtraces = []

[dependencies]
cosmwasm-std = { version = "3.0.11", features = [
  "staking",
  "stargate",
  "iterator",
  "ibc2",
] }
cosmwasm-vm = { version = "3.0.11", features = [
  "staking",
  "stargate",
  "iterator",
  "ibc2",
] }
errno = "0.3.8"
rmp-serde = "1.3.0"
serde = { version = "1.0.103", features = ["derive"] }
serde_json = "1.0.91"
thiserror = "1.0.38"
hex = "0.4.3"
time = { version = "0.3.36", features = ["formatting"] }

[dev-dependencies]
serde = { version = "1.0.103", default-features = false, features = ["derive"] }
tempfile = "3.4.0"

[build-dependencies]
cbindgen = "0.27.0"

[profile.release]
opt-level = 3
debug = false
rpath = true
lto = false
debug-assertions = false
codegen-units = 16
panic = 'unwind'
incremental = true
overflow-checks = true

[patch.crates-io]
wasmer = { git = "https://github.com/gonka-ai/wasmer", rev = "0a354f0583d78b9be0d89fd98bde6f15ad4be7e5" }
wasmer-compiler = { git = "https://github.com/gonka-ai/wasmer", rev = "0a354f0583d78b9be0d89fd98bde6f15ad4be7e5" }
wasmer-compiler-singlepass = { git = "https://github.com/gonka-ai/wasmer", rev = "0a354f0583d78b9be0d89fd98bde6f15ad4be7e5" }
wasmer-derive = { git = "https://github.com/gonka-ai/wasmer", rev = "0a354f0583d78b9be0d89fd98bde6f15ad4be7e5" }
wasmer-middlewares = { git = "https://github.com/gonka-ai/wasmer", rev = "0a354f0583d78b9be0d89fd98bde6f15ad4be7e5" }
wasmer-types = { git = "https://github.com/gonka-ai/wasmer", rev = "0a354f0583d78b9be0d89fd98bde6f15ad4be7e5" }
wasmer-vm = { git = "https://github.com/gonka-ai/wasmer", rev = "0a354f0583d78b9be0d89fd98bde6f15ad4be7e5" }
